services:
  redis:
    image: redis:7-alpine
    container_name: spotq-redis-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: spotq-mongo-dev
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: spotq_eta_db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.0
    container_name: spotq-mlflow-dev
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow-dev-data:/mlflow
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  spotq-eta-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spotq-eta-service-dev
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - ALLOW_SYNTHETIC_MODEL=true
      - PORT=8000
      - LOG_LEVEL=INFO
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=spotq_eta_db
      - MODEL_PATH=app/infrastructure/ml_models/artifacts/candidates/eta_model_candidate.json
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy

volumes:
  mlflow-dev-data:
