services:
  redis:
    image: redis:7-alpine
    container_name: spotq-redis-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: spotq-mongo-dev
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: spotq_eta_db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  spotq-eta-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spotq-eta-service-dev
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - PORT=8000
      - LOG_LEVEL=INFO
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_URI=mongodb://mongodb:27017 
      - MONGO_DB_NAME=spotq_eta_db
      - MODEL_PATH=app/infrastructure/ml_models/artifacts/eta_model_v1.json
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy