[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spotq-eta-service"
version = "0.1.0"
description = "SpotQ ETA Microservice - Sub-50ms Wait-Time Prediction Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core Framework & Settings
    "fastapi>=0.110.0,<0.112.0",
    "uvicorn[standard]>=0.28.0,<0.30.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",

    # Database & Cache Drivers
    "redis>=5.0.1,<6.0.0",
    "motor>=3.3.2,<4.0.0",

    # ML Runtime
    "xgboost>=2.0.3,<2.1.0",
    "numpy>=1.26.0,<2.0.0",

    # Observability & HTTP Client
    "structlog>=24.1.0,<25.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0,<8.0.0",
    "httpx>=0.27.0,<0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<0.24.0",
    "ruff>=0.3.0,<0.4.0",
    "black>=24.2.0,<25.0.0",
]

# Tooling Configurations
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.27.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.3.7",
]
